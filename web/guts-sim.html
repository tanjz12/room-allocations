<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guts Seating Simulator</title>
    <style>
      html,body{margin:0;height:100%;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#111827}
      #gate{max-width:1150px;margin:16px auto;padding:0 12px;line-height:1.45}
      #gate h1{font-size:2em;font-weight:700;margin:0 0 4px}
      #gate p{color:#4b5563;line-height:1.5}@media (min-width:600px){#gate #msg{white-space:pre-line}}
      #gate button{font:inherit;font-size:15px;padding:6px 16px;margin:6px 12px 6px 0;border-radius:4px;border:2px solid #14b8a6;background:#fff;color:#0f766e;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:all .15s}#gate button:hover{background:#14b8a6;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
      #gate .help{font-size:14px;color:#6b7280;margin-top:14px}
            #sim{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
    </style>
  </head>
  <body>
    <div id="gate"><h1>Guts Seating Simulator</h1><p id="msg"></p><div id="btns"></div><p class="help">In Google’s file picker, look up “guts-seating-simulator.html”.</p></div>
    <iframe id="sim" title="Guts Seating Simulator"></iframe>
    <script type="module" src="/src/gutsSim.ts"></script>
  </body>
</html>
