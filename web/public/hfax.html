// Zone finder: dark header with the 3 steps, map with big centered letters, colored station cards; a soft highlight cycles one station at a time (card + its letter on the map). All IDs always visible.
function alTint(S){ const P=S.seats.filter(e=>e[4]>=0&&e[5]!==3); return {...S,deco:String(S.deco||'').replace(/<circle cx="([-\d.]+)" cy="([-\d.]+)" r="([-\d.]+)" fill="#fff" stroke="#9ca3af"\/>/g,(m,cx,cy,r)=>{ let zi=-1,nd=1e9; for(const e of P){ const d=Math.hypot(e[0]+e[2]/2-cx,e[1]+e[3]/2-cy); if(d<nd){ nd=d; zi=e[4]; } } return zi<0?m:`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#${[1,3,5].map(j=>Math.round(255-(255-parseInt(S.zones[zi][1].slice(j,j+2),16))*0.45).toString(16).padStart(2,"0")).join("")}" stroke="${S.zones[zi][1]}" stroke-width="2"/>`; })}; }
function T0F(S){ return mapFit(S,{x:0,y:0,w:1000,h:1000}); }
const FSW=S=>S.zones.length<=4?14:S.zones.length<=10?11:8;
// Each station's region (screen coords): its seats' padded hull, split from neighbours by the dashed lines, traced as straight-edged paths.
function zoneRegions(S,T,lines){ const st=3, k=T.k, q0=S.seats.filter(e=>e[4]>=0), q=q0.concat(S.seats.filter(e=>e[4]<0&&e[5]===3).map(e=>{ let b=-1, d=Infinity; for(const t of q0){ const h=Math.hypot(t[0]-e[0],t[1]-e[1]); if(h<d){ d=h; b=t[4]; } } return [e[0],e[1],e[2],e[3],b,e[5]]; }).filter(e=>e[4]>=0)); if(!q.length) return [];
  const ss=(S.seatSize||Math.max(q[0][2],q[0][3]))*k, pad=ss*0.75, X0=Math.min(...q.map(e=>T.ox+e[0]*k))-2*pad, Y0=Math.min(...q.map(e=>T.oy+e[1]*k))-2*pad, X1=Math.max(...q.map(e=>T.ox+(e[0]+e[2])*k))+2*pad, Y1=Math.max(...q.map(e=>T.oy+(e[1]+e[3])*k))+2*pad;
  const W=Math.ceil((X1-X0)/st), H=Math.ceil((Y1-Y0)/st), N=W*H, nz=S.zones.length, lab=new Int16Array(N).fill(-1), wall=new Uint8Array(N);
