<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>Guts Presentations</title>
<style>
html,body{margin:0;height:100%;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#111827}
#gate{position:fixed;top:15vh;left:0;right:0;box-sizing:border-box;max-width:460px;margin:0 auto;padding:0 20px;text-align:center}
#gate h1{font-size:28px;margin:0 0 18px}
#gate input{font:inherit;font-size:15px;padding:6px 10px;border:1px solid #9ca3af;border-radius:4px;width:14em}
#gate button{font:inherit;font-size:15px;padding:6px 16px;margin:6px;border-radius:4px;border:2px solid #14b8a6;background:#fff;color:#0f766e;cursor:pointer}
#gate button:hover{background:#14b8a6;color:#fff}#gate button:disabled{opacity:.5;cursor:default}
#msg{color:#4b5563;min-height:1.5em}#msg.err{color:#b91c1c}
#sim{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
</style></head><body>
<div id="gate"><h1>Guts Presentations</h1><form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus> <button id="go">Open</button></form><p id="msg"></p></div>
<iframe id="sim" title="Guts Presentations"></iframe>
<script>
const $=id=>document.getElementById(id), b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), SK='guts-present-pw';
const say=(t,err)=>{ $('msg').textContent=t; $('msg').className=err?'err':''; };
async function open(pw){
  $('go').disabled=true; say('Opening\u2026');
  try{
    const r=await fetch('guts-present.json?'+Date.now(),{cache:'no-store'}); if(!r.ok) throw Error('Could not load the simulator (HTTP '+r.status+').');
    const d=await r.json(), base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(d.salt),iterations:d.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    let z; try{ z=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(d.iv)},key,b64(d.ct)); }catch(e){ sessionStorage.removeItem(SK); throw Error('Wrong password.'); }
    const html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    sessionStorage.setItem(SK,pw);
    const fr=$('sim'); fr.style.visibility='hidden'; fr.style.display='block';
    fr.onload=()=>{ fr.onload=null; fr.style.visibility=''; $('gate').style.display='none'; };
    fr.srcdoc=html;
  }catch(e){ say(e.message,true); $('go').disabled=false; $('pw').focus(); }
}
$('f').onsubmit=e=>{ e.preventDefault(); const pw=$('pw').value; if(pw) open(pw); };
const pw0=sessionStorage.getItem(SK); if(pw0) open(pw0);
</script></body></html>
