// Zone finder: dark header with the 3 steps, map with big centered letters, colored station cards; a soft highlight cycles one station at a time (card + its letter on the map). All IDs always visible.
function alTint(S){ const P=S.seats.filter(e=>e[4]>=0&&e[5]!==3); return {...S,deco:String(S.deco||'').replace(/<circle cx="([-\d.]+)" cy="([-\d.]+)" r="([-\d.]+)" fill="#fff" stroke="#9ca3af"\/>/g,(m,cx,cy,r)=>{ let zi=-1,nd=1e9; for(const e of P){ const d=Math.hypot(e[0]+e[2]/2-cx,e[1]+e[3]/2-cy); if(d<nd){ nd=d; zi=e[4]; } } return zi<0?m:`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#${[1,3,5].map(j=>Math.round(255-(255-parseInt(S.zones[zi][1].slice(j,j+2),16))*0.45).toString(16).padStart(2,"0")).join("")}" stroke="${S.zones[zi][1]}" stroke-width="2"/>`; })}; }
function T0F(S){ return mapFit(S,{x:0,y:0,w:1000,h:1000}); }
const FSW=S=>S.zones.length<=4?14:S.zones.length<=10?11:8;
// Each station's region (screen coords): its seats' padded hull, split from neighbours by the dashed lines, traced as straight-edged paths.
function zoneRegions(S,T,lines){ const st=3, k=T.k, q0=S.seats.filter(e=>e[4]>=0), q=q0.concat(S.seats.filter(e=>e[4]<0&&e[5]===3).map(e=>{ let b=-1, d=Infinity; for(const t of q0){ const h=Math.hypot(t[0]-e[0],t[1]-e[1]); if(h<d){ d=h; b=t[4]; } } return [e[0],e[1],e[2],e[3],b,e[5]]; }).filter(e=>e[4]>=0)); if(!q.length) return [];
  const ss=(S.seatSize||Math.max(q[0][2],q[0][3]))*k, pad=ss*0.75, X0=Math.min(...q.map(e=>T.ox+e[0]*k))-2*pad, Y0=Math.min(...q.map(e=>T.oy+e[1]*k))-2*pad, X1=Math.max(...q.map(e=>T.ox+(e[0]+e[2])*k))+2*pad, Y1=Math.max(...q.map(e=>T.oy+(e[1]+e[3])*k))+2*pad;
  const W=Math.ceil((X1-X0)/st), H=Math.ceil((Y1-Y0)/st), N=W*H, nz=S.zones.length, lab=new Int16Array(N).fill(-1), wall=new Uint8Array(N);

    catch(e){ if(T===null){ msg.style.display='flex'; msg.textContent='Can\u2019t reach the server. Retrying\u2026 ('+e.message+')'; } }
    if(again) setTimeout(poll,3000); }
  if(!/^[a-z0-9]{2,12}$/.test(room)) msg.textContent='This link is incomplete. Copy the room link from the simulator.'; else if(!PW&&!k) setTimeout(()=>askPw(),0); else poll();
  let CUR=null, paused=false, hideT=0; const C=document.getElementById('c'), bz=document.getElementById('cz');
  const anims=()=>el.getAnimations?el.getAnimations({subtree:true}):[], loopA=()=>anims().filter(a=>a.effect&&a.effect.getTiming().iterations===Infinity);
  const ctlOk=()=>CUR&&!/^gold/.test(CUR.style)&&loopA().length>0, ctlShow=()=>{ C.hidden=!ctlOk(); };
  const bounds=()=>{ const L=loopA(); const cyc=Math.max(...L.map(a=>+a.effect.getTiming().duration||0))/1000, per=+CUR.per||5, ov=(CUR.style==='ovspot'||CUR.style==='spotlight')?((+CUR.ov>0)?+CUR.ov:Math.round(per*16)/10):0, b=[0]; for(let t=ov||per;t<cyc-0.05;t+=per) b.push(t); return {cyc,b,ref:L[0]}; };
  function step(dir){ if(!ctlOk()) return; const {cyc,b,ref}=bounds(); if(!(cyc>0)) return; const pos=((ref.currentTime||0)/1000)%cyc; let i=b.length-1; while(i>0&&b[i]>pos+1e-6) i--; let tgt;
    if(dir>0) tgt=i+1<b.length?b[i+1]:cyc; else tgt=(pos-b[i]>0.8)?b[i]:(i>0?b[i-1]:b[b.length-1]-cyc);
    const dt=(tgt-pos+0.01)*1000; anims().forEach(a=>{ if(a.currentTime!=null) a.currentTime=a.currentTime+dt; }); }
  function pause(v){ paused=v; anims().forEach(a=>v?a.pause():a.play()); bz.innerHTML=v?'&#x25B6;':'&#x275A;&#x275A;'; bz.title=v?'Play (space)':'Pause (space)'; bz.setAttribute('aria-label',v?'Play':'Pause'); }
  const wake=()=>{ document.body.classList.remove('idle'); if(!C.hidden) C.classList.add('on'); clearTimeout(hideT); hideT=setTimeout(()=>{ if(!C.matches(':hover')){ C.classList.remove('on'); document.body.classList.add('idle'); } },2500); };
  document.addEventListener('mousemove',wake); document.addEventListener('touchstart',wake,{passive:true});
  document.getElementById('cp').onclick=e=>{ e.stopPropagation(); step(-1); wake(); }; document.getElementById('cn').onclick=e=>{ e.stopPropagation(); step(1); wake(); }; bz.onclick=e=>{ e.stopPropagation(); pause(!paused); wake(); };
  C.addEventListener('dblclick',e=>e.stopPropagation()); C.addEventListener('mouseleave',wake);
  document.addEventListener('keydown',e=>{ if(!ctlOk()) return; if(e.key==='ArrowRight'||e.key==='PageDown'){ step(1); e.preventDefault(); } else if(e.key==='ArrowLeft'||e.key==='PageUp'){ step(-1); e.preventDefault(); } else if(e.key===' '){ pause(!paused); e.preventDefault(); } });
  document.addEventListener('dblclick',()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); });
})();
